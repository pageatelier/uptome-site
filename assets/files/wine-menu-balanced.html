<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lunch Menu | UPTOME</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,ital,wght@6..96,400;6..96,500;6..96,400italic&family=Gloock&family=Noto+Serif+KR:wght@400;500&display=swap"
    rel="stylesheet"
  >
  <link href="https://fonts.googleapis.com/css2?family=Gloock&family=Cormorant+Garamond:wght@400;500;600&family=Noto+Serif+KR:wght@400;500;600&display=swap" rel="stylesheet">

  <link
    rel="stylesheet"
    crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"
  >

  <link rel="stylesheet" href="uptome-menu-print-balanced.css">
</head>

<body>
  <main class="menu-sheet ">
    <div class="menu-sheet__frame">

      <header class="menu-header">
        <div class="menu-header__mark"></div>
        <p class="menu-header__brand">UPTOME</p>
        <p class="menu-header__season">Summer 2026</p>

        <h1>Wine List</h1>
      </header>

      <div class="menu-rule"></div>

      <section class="menu-list" aria-label="Lunch course menu">
        <article class="menu-item">
          <p class="menu-item__ko">와인리스트는 곧 업데이트 될 예정입니다.</p>
         
      </section>

      <footer class="menu-footer">
        <div class="menu-rule menu-rule--footer"></div>

        <p>메뉴는 계절과 식재료 수급 상황에 따라 변경될 수 있습니다.</p>
        <p>알레르기나 드시지 못하는 식재료는 예약 시 미리 알려주세요.</p>

        <div class="menu-footer__brand">
          <span>@UP_TO_ME_OFFICIAL</span>
          <strong>UPTOME</strong>
        </div>
      </footer>

    </div>
  </main>
</body>
</html>
